<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Portfolio of Houssam El Kardoudi, Full Stack developer in Fès, Morocco.">
<meta name="theme-color" content="#070B14">
<style>html{color-scheme:dark;background:#070B14}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Houssam El Kardoudi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Hanken+Grotesk:wght@400;500;600&family=Martian+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: one long dark scroll. The hero is a live zellige tile field (the tilework of Fès) whose stars turn toward the pointer and light the name letter by letter. Everything below stays quiet: list rows, one detail panel, one timeline, one terminal. */
:root {
  color-scheme: dark;
  --ink: #070B14;
  --ink2: #0C1322;
  --ink3: #131D35;
  --line: #1D2845;
  --text: #E9EDF7;
  --muted: #93A0BF;
  --cobalt: #3F66F2;
  --accent: #6C9BFF;
  --on-accent: #07101F;
  --f-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --f-body: 'Hanken Grotesk', system-ui, sans-serif;
  --f-mono: 'Martian Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 110px; }
body {
  background: var(--ink);
  color: var(--text);
  font-family: var(--f-body);
  font-size: 1.0625rem;
  line-height: 1.6;
  overflow-x: clip;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 4px; }
.wrap { width: 100%; max-width: 1180px; margin-inline: auto; padding-inline: clamp(16px, 4vw, 40px); }

.skip { position: absolute; left: 16px; top: -60px; background: var(--accent); color: var(--on-accent); padding: 8px 14px; border-radius: 6px; z-index: 50; text-decoration: none; font-weight: 600; }
.skip:focus { top: 12px; }

/* Navigation */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--ink) 84%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.nav .wrap { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 6px 24px; padding-block: 10px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; letter-spacing: -0.02em; text-decoration: none; display: flex; align-items: center; gap: 10px; }
.logo { font: 500 0.95rem var(--f-mono); color: var(--accent); padding: 3px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--ink2); letter-spacing: -0.04em; }
.links { display: flex; gap: 4px; justify-content: center; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.links::-webkit-scrollbar { display: none; }
.links a { padding: 6px 12px; border-radius: 6px; color: var(--muted); text-decoration: none; font-size: 0.95rem; white-space: nowrap; }
.links a:hover { color: var(--text); }
.links a[aria-current="true"] { color: var(--text); background: var(--ink3); }
.ctrl { display: flex; gap: 14px; align-items: center; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: 500 0.75rem var(--f-mono); background: none; color: var(--muted); border: 0; padding: 7px 10px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink3); color: var(--text); }
.progress { position: absolute; left: 0; bottom: -1px; height: 2px; width: 100%; background: var(--accent); transform-origin: left; transform: scaleX(0); }
@media (max-width: 860px) {
  .nav .wrap { grid-template-columns: 1fr auto; }
  .links { grid-column: 1 / -1; order: 3; justify-content: flex-start; }
}

/* Hero */
.hero { position: relative; overflow: hidden; padding-block: clamp(56px, 10vw, 128px) clamp(56px, 8vw, 104px); touch-action: pan-y; }
#field { position: absolute; inset: 0; width: 100%; height: 100%; display: block; -webkit-mask-image: linear-gradient(to bottom, #000 62%, transparent); mask-image: linear-gradient(to bottom, #000 62%, transparent); }
.hero .wrap { position: relative; z-index: 1; pointer-events: none; }
.hero .wrap a, .hero .wrap button { pointer-events: auto; }
.role { font: 500 0.9rem var(--f-mono); color: var(--accent); margin: 0 0 20px; }
h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: clamp(2.8rem, 12.5vw, 9.5rem); line-height: 0.92; letter-spacing: -0.04em; font-variation-settings: "wdth" 86, "opsz" 96; text-wrap: balance; }
.w { display: block; white-space: nowrap; }
.ch { display: inline-block; --k: 0; color: color-mix(in srgb, var(--accent) calc(var(--k) * 100%), var(--text)); transform: translateY(calc(var(--k) * -0.05em)); animation: rise 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) backwards; animation-delay: calc(var(--n) * 40ms); }
@keyframes rise { from { transform: translateY(0.3em); opacity: 0.2; } }
.lead { max-width: 46ch; font-size: clamp(1.1rem, 2.2vw, 1.4rem); color: var(--text); margin: 28px 0 0; line-height: 1.5; text-shadow: 0 0 24px var(--ink); }
.actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
.btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 20px; border-radius: 8px; font: 600 1rem var(--f-body); border: 1px solid var(--line); background: var(--ink2); color: var(--text); cursor: pointer; text-decoration: none; transition: transform 0.2s, border-color 0.2s; }
.btn:hover { transform: translateY(-2px); border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.hint { margin: 36px 0 0; font: 400 0.8rem var(--f-mono); color: var(--muted); }

/* Sections */
.sec { padding-block: clamp(64px, 9vw, 120px); border-top: 1px solid var(--line); }
h2 { margin: 0 0 14px; font-family: var(--f-display); font-weight: 700; font-size: clamp(2rem, 5.5vw, 3.8rem); line-height: 1; letter-spacing: -0.03em; font-variation-settings: "wdth" 90, "opsz" 72; text-wrap: balance; }
.sec-lead { margin: 0 0 48px; color: var(--muted); max-width: 56ch; font-size: 1.1rem; }

/* About */
.about { display: grid; grid-template-columns: 1.15fr 0.85fr; gap: clamp(32px, 6vw, 88px); }
.about > * { min-width: 0; }
.about p { margin: 0 0 1.1em; font-size: clamp(1.1rem, 1.8vw, 1.3rem); line-height: 1.65; max-width: 52ch; }
.facts { margin: 0; }
.facts div { padding-block: 16px; border-top: 1px solid var(--line); }
.facts div:last-child { border-bottom: 1px solid var(--line); }
.facts dt { font: 500 0.8rem var(--f-mono); color: var(--accent); margin-bottom: 4px; }
.facts dd { margin: 0; }
@media (max-width: 820px) { .about { grid-template-columns: 1fr; } }

/* Portrait */
.about-side { min-width: 0; display: grid; gap: 32px; align-content: start; }
.portrait { margin: 0; width: min(100%, 320px); perspective: 900px; padding: 8px 12px 8px 8px; }
.p-float { animation: floaty 6s ease-in-out infinite; }
@keyframes floaty { 50% { transform: translateY(-8px); } }
.p-tilt { position: relative; aspect-ratio: 4 / 5; transform-style: preserve-3d; transition: transform 0.25s ease-out; will-change: transform; }
.p-ring { position: absolute; inset: -6px; border-radius: 22px; overflow: hidden; background: var(--line); }
.p-ring::before { content: ""; position: absolute; inset: -60%; background: conic-gradient(from 0deg, transparent 0 58%, var(--cobalt) 78%, var(--accent) 92%, transparent 100%); animation: spin 6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.p-img { position: relative; display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 16px; box-shadow: 0 0 0 3px var(--ink); background: var(--ink2); }
.portrait.in .p-img { animation: reveal 1s cubic-bezier(0.2, 0.7, 0.2, 1) backwards; }
@keyframes reveal { from { clip-path: inset(0 0 100% 0); transform: scale(1.1); filter: blur(8px); } }
.p-chip { position: absolute; right: -14px; bottom: 22px; transform: translateZ(40px); background: var(--ink2); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font: 500 0.8rem var(--f-mono); color: var(--text); animation: floaty 5s ease-in-out -2s infinite reverse; }
.p-chip code { color: var(--accent); font: inherit; letter-spacing: -0.05em; }

/* Stack */
.stack { display: grid; grid-template-columns: 1.1fr 0.9fr; gap: clamp(28px, 5vw, 72px); align-items: start; }
.stack > * { min-width: 0; }
.group { margin-bottom: 30px; }
.group h3 { font: 600 0.95rem var(--f-body); color: var(--muted); margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
.group h3::before { content: "</>"; font: 500 0.8rem var(--f-mono); color: var(--accent); letter-spacing: -0.05em; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { font: 500 1rem var(--f-body); padding: 9px 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--ink2); color: var(--text); cursor: pointer; transition: border-color 0.2s, transform 0.2s; }
.chip:hover { border-color: var(--accent); transform: translateY(-2px); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.chip.next { border-style: dashed; color: var(--muted); }
.chip.next[aria-pressed="true"] { color: var(--on-accent); border-style: solid; }
.panel { position: sticky; top: 110px; border: 1px solid var(--line); background: var(--ink2); padding: clamp(20px, 3vw, 32px); border-radius: 10px; }
.plogo { width: 88px; height: 88px; border-radius: 14px; background: var(--ink); border: 1px solid var(--line); display: grid; place-items: center; padding: 14px; }
.plogo svg { width: 100%; height: 100%; display: block; }
.plogo.pop svg { animation: pop 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.3); }
@keyframes pop { from { transform: scale(0.6) rotate(-12deg); opacity: 0.2; } }
.pcode { margin-top: 18px; font: 400 0.8rem var(--f-mono); color: var(--accent); }
.panel h3 { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.8rem, 3.4vw, 2.6rem); line-height: 1.05; letter-spacing: -0.02em; margin: 18px 0 10px; overflow-wrap: anywhere; }
.panel p { margin: 0; color: var(--muted); font-size: 1.1rem; }
@media (max-width: 820px) { .stack { grid-template-columns: 1fr; } .panel { position: static; } }

/* Work */
.proj { border-top: 1px solid var(--line); }
.proj:last-child { border-bottom: 1px solid var(--line); }
.phead { width: 100%; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px; padding: 26px 0; background: none; border: 0; color: var(--text); cursor: pointer; text-align: left; font: inherit; }
.ptitle { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.8rem, 5vw, 3.4rem); line-height: 1.05; letter-spacing: -0.03em; transition: color 0.2s, transform 0.3s; overflow-wrap: anywhere; min-width: 0; }
.phead:hover .ptitle, .proj.open .ptitle { color: var(--accent); }
.phead:hover .ptitle { transform: translateX(6px); }
.pmeta { font: 400 0.85rem var(--f-mono); color: var(--muted); display: flex; align-items: center; gap: 12px; }
.pmeta i { font-style: normal; font-size: 1.1rem; width: 1.2ch; text-align: center; }
.pmeta i::before { content: "+"; }
.proj.open .pmeta i { color: var(--accent); }
.proj.open .pmeta i::before { content: "\2212"; }
.pbody { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.4s ease; }
.proj.open .pbody { grid-template-rows: 1fr; }
.pbody > div { overflow: hidden; min-height: 0; visibility: hidden; transition: visibility 0s 0.4s; }
.proj.open .pbody > div { visibility: visible; transition-delay: 0s; }
.pinner { padding-bottom: 32px; max-width: 72ch; }
.pinner p { margin: 0 0 16px; font-size: 1.15rem; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 0; padding: 0; list-style: none; }
.tags li { font: 400 0.8rem var(--f-mono); padding: 4px 10px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); }
.flow { display: grid; grid-template-columns: 1fr 44px 1fr 44px 1fr; align-items: center; margin: 24px 0; max-width: 760px; }
.node { border: 1px solid var(--line); background: var(--ink2); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.node b { display: block; font-family: var(--f-display); font-size: 1.15rem; }
.node span { color: var(--muted); font-size: 0.95rem; }
.node.core { border-color: var(--accent); }
.wire { height: 2px; background: repeating-linear-gradient(90deg, var(--accent) 0 6px, transparent 6px 12px); background-size: 12px 2px; animation: dash 0.8s linear infinite; }
@keyframes dash { to { background-position: 12px 0; } }
@media (max-width: 640px) {
  .flow { grid-template-columns: 1fr; }
  .wire { width: 2px; height: 28px; justify-self: center; background: repeating-linear-gradient(180deg, var(--accent) 0 6px, transparent 6px 12px); background-size: 2px 12px; animation-name: dashv; }
}
@keyframes dashv { to { background-position: 0 12px; } }

/* Journey */
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 130px 28px 1fr; grid-template-areas: "date mk body"; column-gap: 12px; }
.tl .date { grid-area: date; font: 500 0.85rem var(--f-mono); color: var(--muted); text-align: right; padding-top: 4px; font-variant-numeric: tabular-nums; }
.tl .mk { grid-area: mk; position: relative; }
.tl .mk::before { content: ""; position: absolute; left: 50%; top: 10px; bottom: -10px; width: 1px; background: var(--line); }
.tl li:last-child .mk::before { display: none; }
.tl .mk::after { content: ""; position: absolute; left: 50%; top: 6px; width: 9px; height: 16px; margin-left: -4.5px; background: var(--accent); border-radius: 1px; }
.tl li.future .mk::after { background: var(--ink); border: 1.5px solid var(--accent); animation: blink 1.1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
.tl .body { grid-area: body; padding-bottom: 36px; min-width: 0; }
.tl h3 { margin: 0 0 4px; font-family: var(--f-display); font-size: clamp(1.3rem, 2.4vw, 1.7rem); letter-spacing: -0.02em; line-height: 1.2; }
.tl p { margin: 0; color: var(--muted); max-width: 58ch; }
@media (max-width: 640px) {
  .tl li { grid-template-columns: 28px 1fr; grid-template-areas: "mk date" "mk body"; }
  .tl .date { text-align: left; padding-top: 0; margin-bottom: 4px; }
  .tl .mk::before { top: 6px; }
  .tl .mk::after { top: 3px; }
}

/* Assistant */
.bot-fab { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-radius: 999px; background: var(--accent); color: var(--on-accent); border: 0; font: 600 0.95rem var(--f-body); cursor: pointer; box-shadow: 0 10px 30px rgba(63, 102, 242, 0.35); transition: transform 0.2s; }
.bot-fab:hover { transform: translateY(-2px); }
.bot-fab code { font: 500 0.85rem var(--f-mono); letter-spacing: -0.05em; }
.bot-fab[aria-expanded="true"] { display: none; }
.bot { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 41; width: min(400px, calc(100vw - 32px)); height: min(600px, calc(100dvh - 32px - env(safe-area-inset-bottom, 0px) - env(safe-area-inset-top, 0px))); display: flex; flex-direction: column; background: var(--ink2); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55); overflow: hidden; }
.bot[hidden] { display: none; }
.bot-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); background: var(--ink3); }
.bot-head b { font-family: var(--f-display); font-size: 1.05rem; display: block; line-height: 1.2; }
.bot-head small { color: var(--muted); font-size: 0.8rem; display: block; }
.bot-x { background: none; border: 0; color: var(--muted); font-size: 1.4rem; line-height: 1; cursor: pointer; padding: 4px 8px; border-radius: 6px; }
.bot-x:hover { color: var(--text); background: var(--ink2); }
.bot-log { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.msg { max-width: 88%; padding: 10px 14px; border-radius: 12px; font-size: 0.97rem; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; }
.msg.bot-m { background: var(--ink3); border: 1px solid var(--line); align-self: flex-start; border-bottom-left-radius: 4px; }
.msg.me { background: var(--accent); color: var(--on-accent); align-self: flex-end; border-bottom-right-radius: 4px; }
.msg.think { color: var(--muted); font-family: var(--f-mono); font-size: 0.8rem; }
.goto { align-self: flex-start; font: 600 0.85rem var(--f-body); background: none; color: var(--accent); border: 1px solid var(--accent); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.goto:hover { background: var(--accent); color: var(--on-accent); }
.bot-sug { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px 12px; }
.bot-sug button { font: 400 0.8rem var(--f-body); background: none; color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; }
.bot-sug button:hover { border-color: var(--accent); color: var(--accent); }
.bot-form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
.bot-form input { flex: 1; min-width: 0; background: var(--ink); border: 1px solid var(--line); border-radius: 8px; color: var(--text); font: inherit; font-size: 1rem; padding: 10px 12px; }
.bot-form input:focus { outline: none; border-color: var(--accent); }
.bot-form button { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 8px; font: 600 0.95rem var(--f-body); padding: 0 16px; cursor: pointer; }
.bot-form button:disabled { opacity: 0.5; cursor: default; }
.bot-note { padding: 0 16px 12px; color: var(--muted); font-size: 0.75rem; }
@media (max-width: 480px) { .bot { right: 8px; left: 8px; width: auto; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); } }

/* Terminal */
.term { background: #050810; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-family: var(--f-mono); font-size: 0.85rem; max-width: 880px; }
.term-bar { padding: 10px 16px; border-bottom: 1px solid var(--line); color: var(--muted); font-size: 0.75rem; }
.out { height: 320px; overflow-y: auto; padding: 16px; line-height: 1.7; }
.out .ln { white-space: pre-wrap; overflow-wrap: anywhere; }
.out .echo { color: var(--accent); }
.out a { color: var(--accent); }
.out b { color: var(--text); font-weight: 500; }
.out .dim { color: var(--muted); }
.inrow { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid var(--line); }
.inrow label { color: var(--accent); white-space: nowrap; }
.inrow input { flex: 1; min-width: 0; background: none; border: 0; color: var(--text); font: inherit; outline: none; caret-color: var(--accent); }
.inrow:focus-within { box-shadow: inset 0 0 0 1px var(--accent); }
.quick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.quick button { font: 400 0.8rem var(--f-mono); background: var(--ink2); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 7px 12px; cursor: pointer; }
.quick button:hover { border-color: var(--accent); color: var(--accent); }

/* Contact */
.crows { max-width: 880px; }
.crow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; padding-block: 20px; border-top: 1px solid var(--line); }
.crow:last-child { border-bottom: 1px solid var(--line); }
.crow > div { min-width: 0; }
.clabel { font: 500 0.8rem var(--f-mono); color: var(--muted); display: block; margin-bottom: 2px; }
.cval { font-family: var(--f-display); font-weight: 600; font-size: clamp(1.15rem, 3.6vw, 2rem); letter-spacing: -0.02em; overflow-wrap: anywhere; text-decoration: none; }
a.cval:hover { color: var(--accent); }
.crow .btn { padding: 9px 16px; font-size: 0.95rem; }
footer { padding-block: 36px 56px; border-top: 1px solid var(--line); color: var(--muted); font-size: 0.9rem; }
footer .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 24px; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--text); color: var(--ink); padding: 10px 18px; border-radius: 8px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity 0.25s, transform 0.25s; z-index: 60; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style>

<a class="skip" href="#about" data-i="skip"></a>

<header class="nav">
  <div class="wrap">
    <a class="brand" href="#top" aria-label="Houssam El Kardoudi">
      <span class="logo" aria-hidden="true">&lt;/&gt;</span>
      <span>Houssam</span>
    </a>
    <nav class="links" id="links" aria-label="Sections">
      <a href="#about" data-i="n_about"></a>
      <a href="#stack" data-i="n_stack"></a>
      <a href="#work" data-i="n_work"></a>
      <a href="#journey" data-i="n_journey"></a>
      <a href="#terminal" data-i="n_terminal"></a>
      <a href="#contact" data-i="n_contact"></a>

  var dlCap = null;
  function cvBlob(l) {
    var bin = atob(CV[l]), arr = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], { type: 'application/pdf' });
  }
  function saveViaLink(blob, name) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 1500);
    toast(T[lang].cv_start);
  }
  function downloadCv() {
    var name = 'Houssam-El-Kardoudi-CV-' + lang.toUpperCase() + '.pdf';
    var blob;
    try { blob = cvBlob(lang); } catch (e) { return; }
    if (dlCap) {
      dlCap.save({ filename: name, data: blob }).then(function () { toast(T[lang].cv_ok); }, function (e) {
        if (e && e.code === 'declined') return;
        saveViaLink(blob, name);
      });
    } else {
      saveViaLink(blob, name);
    }
  }
  $('#cvHero').addEventListener('click', downloadCv);
  $('#cvContact').addEventListener('click', downloadCv);
  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then(function (d) { dlCap = d || null; }).catch(function () { dlCap = null; });
  }

  /* ---------- Assistant ---------- */
  var bot = (function () {
    var panel = $('#bot'), fab = $('#botFab'), logEl = $('#botLog'), sugEl = $('#botSug'), form = $('#botForm'),
        input = $('#botIn'), sendBtn = $('#botSend'), noteEl = $('#botNote');
    var sample = null, aiOff = false, busy = false, greeted = false, turns = [], ctl = null;
    var SECTIONS = ['about', 'stack', 'work', 'journey', 'terminal', 'contact'];

    var RULES = 'You are the assistant embedded in the portfolio website of Houssam El Kardoudi, a Web Full Stack developer from Fes, Morocco. ' +
      'Answer the visitor using ONLY the facts below. If the answer is not in the facts, say you do not know and suggest writing to Houssam by email. ' +
      'Never invent employers, dates, skills, links or prices. Reply in the language the visitor writes in (French or English; Darija in Latin letters if they use it), ' +
      'in at most 70 words, friendly and direct, plain text with no markdown. ' +
      'If a section of the page would help, finish with one last line "GOTO: x" where x is one of about, stack, work, journey, terminal, contact.\n\nFACTS:\n';

    function norm(s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); }

    function localAnswer(q) {
      var s = norm(q), kb = T[lang].kb;
      if (/^(salut|bonjour|bonsoir|hello|hi|hey|salam|slm|coucou)\b/.test(s)) return { text: kb.hello };
      if (/\bcv\b|resume|curriculum|telecharg|download/.test(s)) return { text: kb.cv, go: 'contact' };
      if (/instagram|insta\b|reseaux sociaux|social/.test(s)) return { text: kb.insta, go: 'contact' };
      if (/prompt|intelligence artificielle|artificial intelligence|\bia\b|ai tools|outils d.?ia|chatgpt/.test(s)) return { text: kb.ai, go: 'about' };
      if (/contact|mail|joindre|ecrire|telephone|phone|numero|\btel\b|github|linkedin|reach|hire|embauch|recrut/.test(s)) return { text: kb.contact, go: 'contact' };
      if (/fanzium|millionaire|stage|intern|quiz|trivia/.test(s)) return { text: kb.fanzium, go: 'work' };
      if (/stack|techno|outil|tool|skill|competence|langage|programming|framework|react|laravel|flutter|angular|php|javascript|mysql|redux|git|postman|uml/.test(s)) return { text: kb.stack, go: 'stack' };
      if (/projet|project|work|realis|assabah|agpsd|portfolio/.test(s)) return { text: kb.work, go: 'work' };
      if (/parcours|journey|formation|etude|study|ecole|school|ista|ofppt|bac\b|diplome|degree|licence|education|timeline|experience/.test(s)) return { text: kb.journey, go: 'journey' };
      if (/langue|language|parle|speak|francais|french|anglais|english|darija|arabe/.test(s)) return { text: kb.langs, go: 'about' };
      if (/hobby|hobbies|loisir|passion|sport|foot|muscu|swim|natation|music|free time|temps libre/.test(s)) return { text: kb.hobbies, go: 'about' };
      if (/qui|who|about|presente|introduce|houssam|profil|toi\b|you\b/.test(s)) return { text: kb.about, go: 'about' };
      return { text: T[lang].b_nomatch };
    }

    function addMsg(text, cls) {
      var d = document.createElement('div');
      d.className = 'msg ' + cls;
      d.textContent = text;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
      return d;
    }
    function addGoto(sec) {
      if (SECTIONS.indexOf(sec) < 0) return;
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'goto';
      b.textContent = T[lang].b_goto + T[lang]['n_' + sec];
      b.addEventListener('click', function () {
        var target = document.getElementById(sec);
        if (window.innerWidth <= 640) close();
        if (target) target.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' });
      });
      logEl.appendChild(b);
      logEl.scrollTop = logEl.scrollHeight;
    }
    function splitGoto(text) {
      var m = /\n?\s*GOTO:\s*([a-z]+)\s*$/i.exec(text);
      if (m) return { text: text.slice(0, m.index).trim(), go: m[1].toLowerCase() };
      return { text: text.replace(/\n?\s*GOTO:?\s*[a-z]*$/i, '').trim(), go: null };
    }
    function updateNote() {
      noteEl.textContent = sample && !aiOff ? T[lang].b_note_ai : T[lang].b_note_local;
    }
    function renderSuggestions() {
      sugEl.innerHTML = '';
      T[lang].b_sug.forEach(function (p) {
        var b = document.createElement('button');
        b.type = 'button'; b.textContent = p[0];
        b.addEventListener('click', function () { ask(p[1]); });
        sugEl.appendChild(b);
      });
    }
    function setBusy(v) { busy = v; sendBtn.disabled = v; }

    function ask(q) {
      q = q.trim();
      if (!q || busy) return;
      addMsg(q, 'me');
      input.value = '';
      if (sample && !aiOff) { askAI(q); return; }
      answerLocal(q);
    }
    function answerLocal(q) {
      var r = localAnswer(q);
      addMsg(r.text, 'bot-m');
      if (r.go) addGoto(r.go);
    }
    function askAI(q) {
      setBusy(true);
      var think = addMsg(T[lang].b_think, 'bot-m think');
      var history = turns.slice(-8);
      history.push({ role: 'user', content: q });
      var msgs = [{ role: 'user', content: RULES + T.en.kbFacts }].concat(history);
      ctl = new AbortController();
      sample(msgs, {
        modelTier: 'quick', cache: false, signal: ctl.signal,
        onText: function (u) { think.className = 'msg bot-m'; think.textContent = splitGoto(u.text).text; logEl.scrollTop = logEl.scrollHeight; }
      }).then(function (res) {
        var p = splitGoto(res.text);
        think.className = 'msg bot-m';
        think.textContent = p.text || res.text;
        turns.push({ role: 'user', content: q }, { role: 'assistant', content: p.text || res.text });
        if (p.go) addGoto(p.go);
      }).catch(function (e) {
        var code = e && e.code;
        if (code === 'not_granted' || code === 'sampling_disabled' || code === 'not_declared' || code === 'capability_disabled' || code === 'capability_removed') {
          aiOff = true; updateNote();
        }
        if (code === 'cancelled') { think.remove(); return; }
        if (e && e.text) { think.className = 'msg bot-m'; think.textContent = splitGoto(e.text).text; return; }
        think.remove();
        answerLocal(q);
      }).then(function () { setBusy(false); ctl = null; });
    }

    function open() {
      panel.hidden = false;
      fab.setAttribute('aria-expanded', 'true');
      if (!greeted) { greeted = true; addMsg(T[lang].b_hello, 'bot-m'); }
      setTimeout(function () { input.focus(); }, 0);
    }
    function close() {
      panel.hidden = true;
      fab.setAttribute('aria-expanded', 'false');
      fab.focus();
    }
    fab.addEventListener('click', open);
    $('#botClose').addEventListener('click', close);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !panel.hidden) close(); });
    form.addEventListener('submit', function (e) { e.preventDefault(); ask(input.value); });

    if (window.claude && typeof window.claude.use === 'function') {
      window.claude.use('sample').then(function (s) { sample = s || null; updateNote(); }).catch(function () { sample = null; });
    }
    function refresh() { renderSuggestions(); updateNote(); }
    return { refresh: refresh, open: open };
  })();

  /* ---------- Boot ---------- */
  var savedLang = store.get('lang');
  var startLang = savedLang === 'fr' || savedLang === 'en' ? savedLang : ((navigator.language || 'en').slice(0, 2) === 'fr' ? 'fr' : 'en');
  applyLang(startLang);
  field.readAccent();
  lines(T[lang].term.welcome);
  field.resize();
  field.start();
  onScroll();
})();
</script>
